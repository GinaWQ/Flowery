{% extends "admin/base_admin.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block admin_content %}
<h1 class="text-2xl font-bold">{{ page_title }}</h1>
{% for error in errors %}
<p class="mt-3 rounded-lg bg-red-100 p-3 text-red-700">{{ error }}</p>
{% endfor %}

<form method="post" class="mt-5 grid max-w-2xl gap-4 rounded-2xl bg-white p-6 shadow">
    <label class="grid gap-1">
        <span class="font-medium">Назва</span>
        <input name="name" value="{{ values.name }}" maxlength="100" required
               class="rounded-lg border px-3 py-2">
    </label>
    <label class="grid gap-1">
        <span class="font-medium">Категорія</span>
        <input name="category" value="{{ values.category }}" maxlength="60" required
               class="rounded-lg border px-3 py-2">
    </label>
    <label class="grid gap-1">
        <span class="font-medium">Опис</span>
        <textarea name="description" rows="4" maxlength="1000"
                  class="rounded-lg border px-3 py-2">{{ values.description }}</textarea>
    </label>
    <label class="grid gap-1">
        <span class="font-medium">Емодзі для картки</span>
        <input name="emoji" value="{{ values.emoji }}" maxlength="12"
               class="rounded-lg border px-3 py-2">
    </label>
    <label class="grid gap-1">
        <span class="font-medium">Ціна, грн</span>
        <input name="price" type="number" min="0.01" step="0.01"
               value="{{ values.price }}" required class="rounded-lg border px-3 py-2">
    </label>
    <div class="flex flex-wrap gap-3">
        <button class="rounded-full bg-brand px-6 py-2 font-semibold text-white">Зберегти</button>
        <a href="{{ url_for('admin_shop.products') }}" class="rounded-full border px-6 py-2">Скасувати</a>
    </div>
</form>
{% endblock %}
