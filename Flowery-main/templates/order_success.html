{% extends "base.html" %}
{% block title %}Замовлення оформлено{% endblock %}
{% block content %}
<section class="mx-auto mt-8 max-w-2xl rounded-3xl bg-white p-8 text-center shadow">
    <p class="text-5xl">🌷</p>
    <h1 class="mt-4 text-3xl font-bold text-brand-dark">Дякуємо, {{ customer_name }}!</h1>
    <p class="mt-3 text-gray-700">
        Замовлення №{{ order_id }} оформлено. Його статус можна переглянути в адмін-панелі.
    </p>
    <p class="mt-3 text-xl font-bold">Сума: {{ '%.2f'|format(total) }} грн</p>
    <a href="{{ url_for('shop.catalog') }}"
       class="mt-6 inline-block rounded-full bg-brand px-6 py-3 font-semibold text-white hover:bg-brand-dark">
        Повернутися до каталогу
    </a>
</section>
{% endblock %}
