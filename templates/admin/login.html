{% extends "base.html" %}
{% block title %}Вхід до адмінки{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-brand mb-4">Вхід до адмін-панелі</h1>
{% if error %}<p class="text-red-600 mb-3">{{ error }}</p>{% endif %}
<form method="post" class="grid gap-3 max-w-sm">
    <input type="password" name="password" placeholder="Пароль"
           class="border rounded-lg px-3 py-2" required>
    <button class="bg-brand text-white py-2 rounded-full">Увійти</button>
</form>
{% endblock %}
