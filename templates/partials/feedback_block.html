<!-- Блок відгуків. Заповнює A на етапі 1. -->

<section class="bg-white rounded-2xl shadow p-6">
    <h2 class="text-2xl font-bold text-brand mb-4">💬 Відгуки клієнтів</h2>

    <div id="feedback-message" class="block-message hidden"></div>
    <div id="feedback-loading" class="hidden text-gray-500 mb-3">⏳ Завантаження відгуків...</div>

    <div class="grid gap-8 md:grid-cols-2">
        <form id="feedback-form" class="grid gap-3">
            <input id="feedback-name" placeholder="Ваше імʼя" class="border rounded-lg px-3 py-2" required>
            <select id="feedback-rating" class="border rounded-lg px-3 py-2" required>
                <option value="">Оцініть букет</option>
                <option value="5">★★★★★ Чудово</option>
                <option value="4">★★★★☆ Добре</option>
                <option value="3">★★★☆☆ Нормально</option>
                <option value="2">★★☆☆☆ Погано</option>
                <option value="1">★☆☆☆☆ Дуже погано</option>
            </select>
            <textarea id="feedback-message-text" rows="4" placeholder="Ваш відгук" class="border rounded-lg px-3 py-2" required></textarea>
            <button type="submit" class="bg-brand text-white font-semibold py-2 rounded-full hover:bg-brand-dark transition">
                Надіслати відгук
            </button>
        </form>

        <div id="feedback-list" class="grid gap-3 content-start"></div>
    </div>
</section>
